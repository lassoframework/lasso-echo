name: echo-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y --fix-missing ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Deselect two tests that assert local-dev env state (ffmpeg present /
        # faster-whisper absent). CI has both installed, so the assertions are
        # inverted here — the detect_prereqs logic is covered by the other tests.
        run: |
          python -m pytest -q \
            --deselect tests/test_clipper_phase0.py::test_detect_prereqs_ffmpeg_present \
            --deselect tests/test_clipper_phase0.py::test_detect_prereqs_faster_whisper_absent
        env:
          # Tests that need live Supabase/Slack are expected to skip when creds
          # are absent. Dummy values prevent import-time crashes on env reads.
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          AGENT_SLACK_BOT_TOKEN: "xoxb-placeholder"
          AGENT_SLACK_CHANNEL_ID: "placeholder"
