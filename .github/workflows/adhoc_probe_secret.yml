name: adhoc-probe-secret

# Diagnostic only: checks WHICH scope (bare repo secret, or one of several
# candidate GitHub Environments) actually exposes an OPENAI_API_KEY secret to
# this repo's Actions runs. Never prints the value, only its presence/length.
on:
  push:
    branches: ["claude/render-card-workflow"]
    paths:
      - ".github/workflows/adhoc_probe_secret.yml"

jobs:
  probe-repo-level:
    runs-on: ubuntu-latest
    steps:
      - name: Check bare repository secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND at repo level (no environment). length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND at repo level"
          fi

  probe-env-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check environment 'production'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND in environment 'production'. length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND in environment 'production'"
          fi

  probe-env-echo:
    runs-on: ubuntu-latest
    environment: echo
    steps:
      - name: Check environment 'echo'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND in environment 'echo'. length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND in environment 'echo'"
          fi

  probe-env-main:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Check environment 'main'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND in environment 'main'. length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND in environment 'main'"
          fi

  probe-env-astra:
    runs-on: ubuntu-latest
    environment: astra
    steps:
      - name: Check environment 'astra'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND in environment 'astra'. length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND in environment 'astra'"
          fi
