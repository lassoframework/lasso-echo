name: adhoc-probe-secret

# Diagnostic only: checks WHICH scope (bare repo secret, bare repo VARIABLE,
# or one of several candidate GitHub Environments) actually exposes an
# OPENAI_API_KEY value to this repo's Actions runs. Never prints a secret
# value, only presence/length; a plain repo VARIABLE (vars.*) is not secret
# by GitHub's own model, but this still only prints its length, not its value.
on:
  push:
    branches: ["claude/render-card-workflow"]
    paths:
      - ".github/workflows/adhoc_probe_secret.yml"

jobs:
  probe-repo-variable:
    runs-on: ubuntu-latest
    steps:
      - name: Check bare repository VARIABLE (not secret)
        env:
          OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND as a repo VARIABLE (vars.*, not secrets.*). length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND as a repo variable"
          fi

  probe-env-Production:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check environment 'Production' (capitalized)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND in environment 'Production'. length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND in environment 'Production'"
          fi

  probe-env-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check environment 'prod'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND in environment 'prod'. length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND in environment 'prod'"
          fi

  probe-env-openai:
    runs-on: ubuntu-latest
    environment: openai
    steps:
      - name: Check environment 'openai'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND in environment 'openai'. length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND in environment 'openai'"
          fi

  probe-env-astra-caps:
    runs-on: ubuntu-latest
    environment: Astra
    steps:
      - name: Check environment 'Astra' (capitalized)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "FOUND in environment 'Astra'. length=${#OPENAI_API_KEY}"
          else
            echo "NOT FOUND in environment 'Astra'"
          fi
